<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Untitled Survival Story</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div id="app">
    <main>
      <header>
        <span id="clock"></span>
        <span class="tools">
          <button id="btn-radio" class="tool" type="button" hidden>Radio<i class="dot" hidden></i></button>
          <button id="btn-diary" class="tool" type="button" hidden>Diary<i class="dot" hidden></i></button>
          <button id="toggle" class="tool" type="button" aria-expanded="true">Status</button>
        </span>
      </header>

      <section id="story">
        <img id="scene-image" alt="" hidden>
        <h1 id="title"></h1>
        <div id="text"></div>
      </section>

      <section id="stage">
        <div id="card">
          <div class="reveal left" id="reveal-left"></div>
          <div class="reveal right" id="reveal-right"></div>
        </div>
        <div id="ending" hidden>
          <p id="ending-days"></p>
          <p id="ending-best"></p>
          <button id="restart" type="button">Try again</button>
        </div>
      </section>

      <p id="hint">drag the card left or right</p>
    </main>

    <aside>
      <div class="side-inner">
        <div id="day-line"></div>
        <div id="stats"></div>
        <p id="record"></p>
      </div>
    </aside>
  </div>

  <!-- Full-screen page for the radio log / diary (shown via #radio or #diary in the URL) -->
  <div id="page" hidden>
    <div class="page-inner">
      <button id="page-back" type="button">&larr; Back to the story</button>
      <h2 id="page-title"></h2>
      <ul id="page-list"></ul>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
