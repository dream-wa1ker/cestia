# Random pool "scavenge". A decision with `next: pool:scavenge` draws ONE scene
# from every scene below that (a) has `pool: scavenge`, (b) hasn't been seen this
# run, (c) meets its requires / requires_flag. Higher `weight` = more likely.
# Scenes seen in the last few runs are made less likely automatically.
# When nothing is left, POOL.scavenge.empty is shown.

- id: POOL.scavenge.01
  title: The Pharmacy
  pool: scavenge
  weight: 3
  requires_flag: {medicine_at: pharmacy}     # only exists in some worlds
  text: |
    The shutters are half torn off. Inside, the shelves are stripped bare, except for the back room, where a locked cabinet has been forced open and forgotten.
  left:
    label: "Take everything you can carry."
    effect: {supplies: "+4", infection_exposure: "+4", hours: "+1"}
    next: P1.2
  right:
    label: "Take only the bandages and painkillers."
    effect: {health: "+4", supplies: "+1", hours: "+1"}
    next: P1.2

- id: POOL.scavenge.02
  title: The Clinic
  pool: scavenge
  weight: 3
  requires_flag: {medicine_at: clinic}
  text: |
    A small clinic, its door chained from the inside and its window smashed from the outside. The waiting room is a mess, but the treatment room at the back is untouched.
  left:
    label: "Take the antibiotics."
    effect: {infection_exposure: "-15", health: "+5", hours: "+1"}
    next: P1.2
  right:
    label: "Take the food and water someone hid here."
    effect: {supplies: "+5", hours: "+1"}
    next: P1.2

- id: POOL.scavenge.03
  title: The Dog
  pool: scavenge
  weight: 2
  text: |
    The dog you saw from the window is following you at a distance, limping, ribs showing. It stops when you stop.
  left:
    label: "Hold out your hand."
    effect: {hours: "+1"}
    outcomes:
      - {weight: 6, next: POOL.scavenge.03.A}
      - {weight: 4, next: POOL.scavenge.03.B}
  right:
    label: "Keep walking and do not look back."
    effect: {hours: "+1"}
    next: P1.2

- id: POOL.scavenge.03.A
  title: A Small Trust
  text: |
    The dog sniffs your fingers, then turns and trots away. You follow it to a collapsed stairwell where someone left a bag behind, a long time ago.
  left:
    label: "Take the bag and head back."
    effect: {supplies: "+3", trust: "+1", hours: "+1"}
    next: P1.2
  right:
    label: "Sit with the dog for a while first."
    effect: {stamina: "+5", hours: "+2"}
    next: P1.2

- id: POOL.scavenge.03.B
  title: Teeth
  text: |
    It goes for your hand before you can pull it back. It is fast, and it is not a dog anymore, not really. You kick it off and stumble away with your arm bleeding.
  left:
    label: "Wash the wound and wrap it."
    effect: {health: "-8", infection_exposure: "+6", hours: "+1"}
    next: P1.2
  right:
    label: "Run first, deal with it later."
    effect: {health: "-8", infection_exposure: "+12", stamina: "-6", hours: "+1"}
    next: P1.2

- id: POOL.scavenge.04
  title: Fresh Footprints
  pool: scavenge
  weight: 2
  text: |
    In the dust of a stairwell landing: bootprints, not yours. They are fresh, and they lead up.
  left:
    label: "Follow the prints."
    effect: {trust: "+1", stamina: "-4", hours: "+2"}
    sets_flag: {saw_survivor: "yes"}
    next: P1.2
  right:
    label: "Wipe them out with your boot and leave."
    effect: {hours: "+1"}
    next: P1.2

- id: POOL.scavenge.05
  title: Just Dust
  pool: scavenge
  weight: 3
  text: |
    Room after room of nothing. Overturned furniture, a child's shoe, curtains rotted to lace. Someone got here before you, or nothing was ever here.
  left:
    label: "Search again, more carefully."
    effect: {supplies: "+1", stamina: "-3", hours: "+2"}
    next: P1.2
  right:
    label: "Move on."
    effect: {hours: "+1"}
    next: P1.2

- id: POOL.scavenge.empty
  title: Picked Clean
  text: |
    You have been through everything within reach. What is left is either too dangerous to touch or was never worth taking.
  left:
    label: "Go back inside."
    effect: {hours: "+2"}
    next: P1.2
  right:
    label: "Keep walking and see how far you get."
    effect: {stamina: "-5", infection_exposure: "+5", hours: "+3"}
    next: P1.2
