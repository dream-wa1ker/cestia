# Id convention (reads like a tree):
#   P1.0          root            P1.0.L / P1.0.R   left / right child of P1.0
#   P1.1, P1.2    hubs where branches merge         P1.0.L.F   fallback of P1.0.L
# Every scene has a title, text, and exactly two decisions: left and right.
# effect values: "+5" / "-5" change a stat, a bare number sets it.
# hours: "+N" is how long the decision takes (24 hours = one day survived).

- id: P1.0
  title: The Note
  # image: assets/scenes/note.png   # optional; shown above the story text
  text: |
    You wake up with a bandage around your head. Next to you lies a note.

    "You met with an accident. You fell from the third floor of an abandoned building. Jershy used most of our resources to bring you back to a stable state. You might not remember most of what happened. The world has ended. The details will come back to you gradually. We left a radio for you, in case you are alive and reading this."

    Signing off - John
  radio:
    - "[EMERGENCY BROADCAST : 18-07-2036:15:31] Do not visit zone-245 in sector-81..."
  left:
    label: "Explore the place you are in..."
    effect: {stamina: "-5", hours: "+1"}
    next: P1.0.L
  right:
    label: "Check the radio for any intel..."
    effect: {hours: "+1"}
    next: P1.0.R

- id: P1.0.L
  title: The Window
  requires: {stamina: ">10"}
  fallback: P1.0.L.F
  text: |
    You get up and walk to the window. All you see is a deserted land: cars crashed and crushed on the road, paint fading away, the skeletal remains of people. A dog roams between the wrecks. You are on a top floor with no idea how many floors there are. Seems like you are 70 meters above the ground.

    You search the room. The telecast radio, a rusty knife, a worn-out backpack, the hospital bed you woke up in, a few packs of morphine tablets. Inside the backpack: a rechargeable torch, some clothes, and a blank diary.
  left:
    label: "Go out and see what is out there. Come back for the supplies later."
    effect: {stamina: "-1", supplies: "+1", infection_exposure: "+5", hours: "+1"}
    next: P1.1
  right:
    label: "Grab the supplies first, then go out."
    effect: {stamina: "-2", supplies: "+5", infection_exposure: "+2", hours: "+2"}
    next: P1.1

- id: P1.0.L.F
  title: Weak Legs
  text: |
    You push yourself up and your legs give out. The room tilts. Whatever is outside the window will have to wait.
  left:
    label: "Sleep until you feel stronger."
    effect: {stamina: "+15", hours: "+8"}
    next: P1.0.L
  right:
    label: "Lie still and listen to the radio."
    effect: {hours: "+1"}
    next: P1.0.R

- id: P1.0.R
  title: Static
  text: |
    You turn the dial slowly. The hiss rolls over itself, and then the broadcast loops again, the same calm voice reading the same warning.

    Under it, faint and unscripted, another voice: "If anyone is there... anyone at all..."
  left:
    label: "Answer the call."
    effect: {trust: "+1", hours: "+1"}
    sets_flag: {answered_radio: "yes"}
    next: P1.1
  right:
    label: "Stay quiet and keep listening."
    effect: {hours: "+2"}
    next: P1.1

- id: P1.1
  title: The Corridor
  text: |
    The door sticks, then gives. Beyond it is a long corridor of numbered doors, dust hanging in the light from the stairwell at the far end. Somewhere below, something scrapes across concrete, then stops.
  left:
    label: "Search the rooms along the corridor."
    effect: {hours: "+3", stamina: "-5"}
    next: pool:scavenge
  right:
    label: "Take the stairwell down and look around."
    effect: {hours: "+2", stamina: "-3", infection_exposure: "+3"}
    next: pool:scavenge

# Placeholder hub for the rest of Part 1. Replace with real story beats;
# every scavenge scene returns here for now.
- id: P1.2
  title: Back Inside
  text: |
    You return to the room and close the door behind you. The radio hisses. The light through the window has moved. The world has not.
  left:
    label: "Rest until morning."
    effect: {stamina: "+20", hours: "+8"}
    next: P1.2
  right:
    label: "Go out again."
    effect: {stamina: "-4", hours: "+2"}
    next: pool:scavenge
