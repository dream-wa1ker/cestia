- id: P1S0
  # id structure : PXSX {P -> Part, S -> Scene, X -> Stage Number}
  day: 0
  # image: assets/scenes/day01.png   # omit to use assets/default.png
  text: |
    You wake up, with a bandage in your head. And before you is a note stating : 

    "You met with an accident, fell from 3rd floor of one of the abandoned building. Jershy used most of the resources to bring you to a stable state. You might not remember most of the things that happened. The world has end. You will get to remember the details gradually. We have left a radio telecast for you to communicate with us in case you are alive and read this note."

    Signing Off - John

    21-07-2036:10:11
  radio:
    - "[EMERGENCY BROADCAST : 18-07-2036:15:31] Do not visit zone-245 in sector-81..."
  choices:
    - label: "Explore the place you are currently in..."
      effect: {stamina: "-5"}
      next_scene: P1S1
      #
    - label: "Check the radio if there are any intel..."
      next_scene: P1S2 

- id: P1S1 
  day: 0
  requires:
    stamina: ">20"
  fallback: P1S0_F
  text: |
    You get up and walk to the window. All you see is - a deserted land, cars in road, crashed and crushed. Paints fading away gradually, and skeletal remains of the people. You see a dog roaming around. And you are in a top storey building with unknown number of floors in it. Seems like you are 70 meters from the ground floor.

    You search the room for supplies, but all you can find is the telecast radio, a rusty knive, a worn out backbag, and the hospitalised bed from which you woke up and a few packs morphine tablets. Inside the bag, there is a rechargable torch, some clothes, and a blank diary.

    21-07-2036:10:47

  choices:
    - label: "Go outside the room to check what's out there and come back to collect resources."

      # fta : 1.) Bag, 2.) terminal shows your items, 3.) IDK

      # condition: "stamina > 20", you can add something like this here

      effect: {stamina: "-1", supplies: "+1", infection_exposure: "+5"}
      next_scene: L082
    - label: "Grab the resources, Go outside the room to check what's out there."
      effect: {stamina: "-2", supplies: "+5", infection_exposure: "+2"}
      next_scene: L182

- id: P1S2
